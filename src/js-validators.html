<script>
/* ============================================================
   SETUR Forms GAS — Validadores Client-Side
   Máscaras, CPF, CNPJ, e-mail, telefone, CEP
   ============================================================ */

const Validadores = {

  // ── CPF ────────────────────────────────────────────────────
  cpf(valor) {
    const limpo = valor.replace(/\D/g, '');
    if (limpo.length !== 11) return false;
    if (/^(\d)\1+$/.test(limpo)) return false;
    let soma = 0;
    for (let i = 0; i < 9; i++) soma += parseInt(limpo[i]) * (10 - i);
    let resto = (soma * 10) % 11;
    if (resto === 10 || resto === 11) resto = 0;
    if (resto !== parseInt(limpo[9])) return false;
    soma = 0;
    for (let i = 0; i < 10; i++) soma += parseInt(limpo[i]) * (11 - i);
    resto = (soma * 10) % 11;
    if (resto === 10 || resto === 11) resto = 0;
    return resto === parseInt(limpo[10]);
  },

  // ── CNPJ ───────────────────────────────────────────────────
  cnpj(valor) {
    const limpo = valor.replace(/\D/g, '');
    if (limpo.length !== 14) return false;
    if (/^(\d)\1+$/.test(limpo)) return false;
    const calc = (base, pesos) => {
      const soma = base.reduce((a, d, i) => a + d * pesos[i], 0);
      const r = soma % 11;
      return r < 2 ? 0 : 11 - r;
    };
    const d = limpo.split('').map(Number);
    const p1 = [5,4,3,2,9,8,7,6,5,4,3,2];
    const p2 = [6,5,4,3,2,9,8,7,6,5,4,3,2];
    return calc(d.slice(0,12), p1) === d[12] && calc(d.slice(0,13), p2) === d[13];
  },

  // ── Email ──────────────────────────────────────────────────
  email(valor) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(valor.trim());
  },

  // ── Telefone BR ────────────────────────────────────────────
  telefoneBR(valor) {
    const limpo = valor.replace(/\D/g, '');
    return limpo.length === 10 || limpo.length === 11;
  },

  // ── CEP ────────────────────────────────────────────────────
  cep(valor) {
    return /^\d{5}-?\d{3}$/.test(valor);
  },

  // ── Número ─────────────────────────────────────────────────
  numero(valor) {
    return !isNaN(parseFloat(valor)) && isFinite(valor);
  },

  // ── Regex customizado ──────────────────────────────────────
  regex(valor, pattern) {
    try { return new RegExp(pattern).test(valor); }
    catch(e) { return false; }
  },

  // ── Validar por tipo ───────────────────────────────────────
  porTipo(valor, tipoValidacao, regexCustom) {
    if (!valor) return null;
    switch(tipoValidacao) {
      case 'EMAIL':    return this.email(valor)      ? null : 'E-mail inválido.';
      case 'TELEFONE': return this.telefoneBR(valor) ? null : 'Telefone inválido. Use (XX) XXXXX-XXXX.';
      case 'CPF':      return this.cpf(valor)        ? null : 'CPF inválido. Verifique os dígitos.';
      case 'CNPJ':     return this.cnpj(valor)       ? null : 'CNPJ inválido.';
      case 'CEP':      return this.cep(valor)        ? null : 'CEP inválido.';
      case 'NUMERO':   return this.numero(valor)     ? null : 'Apenas números são permitidos.';
      case 'REGEX':    return (regexCustom && !this.regex(valor, regexCustom)) ? 'Formato inválido.' : null;
      default:         return null;
    }
  },
};

// ── Máscaras ────────────────────────────────────────────────
const Mascaras = {

  cpf(el) {
    el.addEventListener('input', () => {
      let v = el.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
      else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
      else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
      el.value = v;
    });
  },

  cnpj(el) {
    el.addEventListener('input', () => {
      let v = el.value.replace(/\D/g, '').slice(0, 14);
      if (v.length > 12) v = v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{1,2})/, '$1.$2.$3/$4-$5');
      else if (v.length > 8) v = v.replace(/(\d{2})(\d{3})(\d{3})(\d{1,4})/, '$1.$2.$3/$4');
      else if (v.length > 5) v = v.replace(/(\d{2})(\d{3})(\d{1,3})/, '$1.$2.$3');
      else if (v.length > 2) v = v.replace(/(\d{2})(\d{1,3})/, '$1.$2');
      el.value = v;
    });
  },

  telefone(el) {
    el.addEventListener('input', () => {
      let v = el.value.replace(/\D/g, '').slice(0, 11);
      if (v.length === 11) v = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
      else if (v.length > 6) v = v.replace(/(\d{2})(\d{4})(\d{1,4})/, '($1) $2-$3');
      else if (v.length > 2) v = v.replace(/(\d{2})(\d{1,4})/, '($1) $2');
      el.value = v;
    });
  },

  cep(el) {
    el.addEventListener('input', () => {
      let v = el.value.replace(/\D/g, '').slice(0, 8);
      if (v.length > 5) v = v.replace(/(\d{5})(\d{1,3})/, '$1-$2');
      el.value = v;
    });
  },

  /** Aplica a máscara correta conforme o tipo de validação */
  aplicar(el, tipoValidacao) {
    switch(tipoValidacao) {
      case 'CPF':      this.cpf(el);      break;
      case 'CNPJ':     this.cnpj(el);     break;
      case 'TELEFONE': this.telefone(el); break;
      case 'CEP':      this.cep(el);      break;
    }
  },
};

// ── Canvas de Assinatura ─────────────────────────────────────
class CanvasAssinatura {
  constructor(canvasEl) {
    this.canvas = canvasEl;
    this.ctx = canvasEl.getContext('2d');
    this.desenhando = false;
    this.vazio = true;
    this.modificado = false;
    this._bind();
    this._ajustarDPI();
    window.addEventListener('resize', Utils.debounce(() => this._ajustarDPI(), 200));
  }

  _ajustarDPI() {
    const dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.getBoundingClientRect();
    if (rect.width === 0) return;
    this.canvas.width  = rect.width  * dpr;
    this.canvas.height = rect.height * dpr;
    this.ctx.scale(dpr, dpr);
    this.canvas.style.width  = rect.width  + 'px';
    this.canvas.style.height = rect.height + 'px';
    this.ctx.strokeStyle = '#1a1a1a';
    this.ctx.lineWidth = 2;
    this.ctx.lineCap = 'round';
    this.ctx.lineJoin = 'round';
  }

  _getPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: src.clientX - rect.left, y: src.clientY - rect.top };
  }

  _bind() {
    const start = (e) => { e.preventDefault(); this.desenhando = true; this.vazio = false; this.modificado = true; const p = this._getPos(e); this.ctx.beginPath(); this.ctx.moveTo(p.x, p.y); };
    const move  = (e) => { e.preventDefault(); if (!this.desenhando) return; const p = this._getPos(e); this.ctx.lineTo(p.x, p.y); this.ctx.stroke(); };
    const end   = (e) => { e.preventDefault(); this.desenhando = false; };

    this.canvas.addEventListener('mousedown', start);
    this.canvas.addEventListener('mousemove', move);
    this.canvas.addEventListener('mouseup', end);
    this.canvas.addEventListener('mouseleave', end);
    this.canvas.addEventListener('touchstart', start, { passive: false });
    this.canvas.addEventListener('touchmove',  move,  { passive: false });
    this.canvas.addEventListener('touchend',   end,   { passive: false });
  }

  limpar() {
    const dpr = window.devicePixelRatio || 1;
    const w = this.canvas.width / dpr;
    const h = this.canvas.height / dpr;
    this.ctx.clearRect(0, 0, w, h);
    this.vazio = true;
    this.modificado = true;
  }

  /** Retorna o PNG em base64 (sem prefixo data:image/...) */
  exportarBase64() {
    if (this.vazio) return null;
    return this.canvas.toDataURL('image/png').split(',')[1];
  }
}
</script>
