<style>
/* ============================================================
   SETUR Forms GAS — CSS Compartilhado
   Importado via include('css') nos templates
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

/* ── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cor-primaria:    #1a73e8;
  --cor-primaria-h:  #1557b0;
  --cor-fundo:       #f8f9fa;
  --cor-card:        #ffffff;
  --cor-texto:       #202124;
  --cor-texto-soft:  #5f6368;
  --cor-borda:       #e0e0e0;
  --cor-erro:        #d93025;
  --cor-sucesso:     #1e8e3e;
  --cor-aviso:       #f9a825;
  --raio:            12px;
  --sombra:          0 2px 12px rgba(0,0,0,0.08);
  --sombra-hover:    0 4px 20px rgba(0,0,0,0.14);
  --transicao:       0.2s ease;
  --fonte:           'Inter', 'Segoe UI', sans-serif;
}

html { font-size: 16px; -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--fonte);
  background: var(--cor-fundo);
  color: var(--cor-texto);
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Tipografia ─────────────────────────────────────────── */
h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.2; }
h2 { font-size: 1.375rem; font-weight: 600; line-height: 1.3; }
h3 { font-size: 1.125rem; font-weight: 600; }
p  { margin-bottom: 0.75rem; }
a  { color: var(--cor-primaria); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Layout Container ─────────────────────────────────────── */
.container { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.container--wide { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

/* ── Card ─────────────────────────────────────────────────── */
.card {
  background: var(--cor-card);
  border-radius: var(--raio);
  box-shadow: var(--sombra);
  padding: 28px 32px;
  margin-bottom: 16px;
}
@media (max-width: 480px) { .card { padding: 20px 16px; } }

/* ── Botões ─────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 8px;
  font-family: var(--fonte);
  font-size: 0.9375rem;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: background var(--transicao), box-shadow var(--transicao), transform var(--transicao);
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

.btn--primary   { background: var(--cor-primaria); color: #fff; }
.btn--primary:hover:not(:disabled) { background: var(--cor-primaria-h); box-shadow: 0 2px 8px rgba(26,115,232,0.4); }

.btn--secondary { background: transparent; color: var(--cor-primaria); border: 1.5px solid var(--cor-primaria); }
.btn--secondary:hover:not(:disabled) { background: rgba(26,115,232,0.08); }

.btn--danger    { background: var(--cor-erro); color: #fff; }
.btn--danger:hover:not(:disabled) { background: #b52a1c; }

.btn--ghost     { background: transparent; color: var(--cor-texto-soft); }
.btn--ghost:hover:not(:disabled) { background: rgba(0,0,0,0.06); }

.btn--sm  { padding: 6px 14px; font-size: 0.875rem; }
.btn--lg  { padding: 13px 28px; font-size: 1rem; }
.btn--full { width: 100%; justify-content: center; }

/* ── Formulário / Campos ─────────────────────────────────── */
.campo { margin-bottom: 20px; }
.campo__label {
  display: block;
  font-weight: 500;
  font-size: 0.9375rem;
  margin-bottom: 6px;
  color: var(--cor-texto);
}
.campo__label .obrigatorio { color: var(--cor-erro); margin-left: 2px; }
.campo__descricao { font-size: 0.8125rem; color: var(--cor-texto-soft); margin-top: 4px; margin-bottom: 0; }

.campo__input,
.campo__select,
.campo__textarea {
  width: 100%;
  padding: 10px 14px;
  font-family: var(--fonte);
  font-size: 0.9375rem;
  border: 1.5px solid var(--cor-borda);
  border-radius: 8px;
  background: var(--cor-card);
  color: var(--cor-texto);
  transition: border-color var(--transicao), box-shadow var(--transicao);
  outline: none;
}
.campo__input:focus,
.campo__select:focus,
.campo__textarea:focus {
  border-color: var(--cor-primaria);
  box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
}
.campo__input--erro,
.campo__select--erro,
.campo__textarea--erro {
  border-color: var(--cor-erro);
}
.campo__input--erro:focus,
.campo__select--erro:focus,
.campo__textarea--erro:focus {
  box-shadow: 0 0 0 3px rgba(217,48,37,0.12);
}
.campo__textarea { resize: vertical; min-height: 100px; }
.campo__erro {
  color: var(--cor-erro);
  font-size: 0.8125rem;
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 4px;
  animation: slideDown 0.2s ease;
}
@keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* Radio e Checkbox */
.opcao {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: background var(--transicao);
  margin-bottom: 6px;
  border: 1.5px solid var(--cor-borda);
}
.opcao:hover { background: rgba(26,115,232,0.06); border-color: var(--cor-primaria); }
.opcao input[type="radio"],
.opcao input[type="checkbox"] { margin-top: 2px; accent-color: var(--cor-primaria); width: 17px; height: 17px; flex-shrink: 0; }
.opcao__label { font-size: 0.9375rem; cursor: pointer; flex: 1; }

/* Estrelas */
.estrelas { display: flex; gap: 6px; flex-wrap: wrap; }
.estrela {
  font-size: 1.75rem;
  cursor: pointer;
  color: #d1d5db;
  transition: color 0.15s, transform 0.15s;
  line-height: 1;
  user-select: none;
}
.estrela:hover, .estrela.ativa { color: #f59e0b; transform: scale(1.12); }

/* Slider */
.slider-wrap { display: flex; align-items: center; gap: 12px; }
.slider-wrap input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 6px;
  border-radius: 3px;
  background: var(--cor-borda);
  outline: none;
  accent-color: var(--cor-primaria);
}
.slider-valor {
  min-width: 40px;
  text-align: center;
  font-weight: 600;
  color: var(--cor-primaria);
  font-size: 1.125rem;
}

/* Escala linear */
.escala { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.escala__label-ext { font-size: 0.8125rem; color: var(--cor-texto-soft); }
.escala__btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1.5px solid var(--cor-borda);
  background: var(--cor-card);
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s;
}
.escala__btn:hover, .escala__btn.ativo {
  background: var(--cor-primaria);
  color: #fff;
  border-color: var(--cor-primaria);
}

/* Upload */
.upload-area {
  border: 2px dashed var(--cor-borda);
  border-radius: 10px;
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: border-color var(--transicao), background var(--transicao);
}
.upload-area:hover, .upload-area.dragover {
  border-color: var(--cor-primaria);
  background: rgba(26,115,232,0.04);
}
.upload-area__icon { font-size: 2rem; margin-bottom: 8px; }
.upload-area__texto { font-size: 0.9rem; color: var(--cor-texto-soft); }
.upload-preview { margin-top: 10px; font-size: 0.875rem; color: var(--cor-sucesso); }

/* Detalhes do Upload e Visualização */
.upload-success-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
}
.upload-image-preview {
  max-width: 100%;
  max-height: 150px;
  object-fit: contain;
  border-radius: 8px;
  border: 1px solid var(--cor-borda);
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  background: #fff;
}
.upload-file-details {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
}
.upload-file-name {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--cor-sucesso);
  text-align: center;
  word-break: break-all;
}
.upload-view-link {
  font-size: 0.825rem;
  color: var(--cor-primaria);
  text-decoration: underline;
  font-weight: 500;
  cursor: pointer;
}
.upload-remove-btn {
  background: rgba(220, 53, 69, 0.08);
  color: #dc3545;
  border: 1px solid rgba(220, 53, 69, 0.2);
  padding: 6px 12px;
  font-size: 0.8rem;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.upload-remove-btn:hover {
  background: #dc3545;
  color: #fff;
  border-color: #dc3545;
}
.upload-limites-texto {
  font-size: 0.78rem;
  color: var(--cor-texto-soft);
  margin-top: 6px;
  opacity: 0.85;
}

/* Canvas assinatura */
.canvas-wrap { position: relative; }
.canvas-assinatura {
  width: 100%;
  max-width: 500px;
  height: 160px;
  border: 1.5px solid var(--cor-borda);
  border-radius: 10px;
  background: #fafafa;
  cursor: crosshair;
  display: block;
  touch-action: none;
}
.canvas-limpar {
  margin-top: 8px;
  font-size: 0.8125rem;
  color: var(--cor-erro);
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--fonte);
}

/* ── Barra de Progresso ──────────────────────────────────── */
.progress-bar {
  height: 6px;
  background: var(--cor-borda);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 24px;
}
.progress-bar__fill {
  height: 100%;
  background: var(--cor-primaria);
  border-radius: 3px;
  transition: width 0.4s ease;
}

/* ── Badges de Status ─────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.badge--ativo     { background: #e6f4ea; color: #1e7e34; }
.badge--rascunho  { background: #fff3cd; color: #856404; }
.badge--pausado   { background: #e8eaed; color: #5f6368; }
.badge--encerrado { background: #fce8e6; color: #c5221f; }

/* ── Toast / Notificações ─────────────────────────────────── */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 9999;
  pointer-events: none;
}
.toast {
  padding: 14px 18px;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 500;
  color: #fff;
  max-width: 340px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.16);
  pointer-events: all;
  animation: toastIn 0.3s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.toast--sucesso { background: #1e8e3e; }
.toast--erro    { background: #d93025; }
.toast--aviso   { background: #f9a825; color: #202124; }
.toast--info    { background: #1a73e8; }

/* ── Loading Spinner ─────────────────────────────────────── */
.spinner {
  width: 22px; height: 22px;
  border: 3px solid rgba(255,255,255,0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
}
.spinner--dark {
  border-color: rgba(26,115,232,0.25);
  border-top-color: var(--cor-primaria);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Estado vazio ─────────────────────────────────────────── */
.estado-vazio {
  text-align: center;
  padding: 60px 24px;
  color: var(--cor-texto-soft);
}
.estado-vazio__icone { font-size: 3rem; margin-bottom: 16px; }
.estado-vazio h3 { color: var(--cor-texto); margin-bottom: 8px; }

/* ── Responsividade ──────────────────────────────────────── */
@media (max-width: 600px) {
  h1 { font-size: 1.375rem; }
  h2 { font-size: 1.125rem; }
  #toast-container { left: 16px; right: 16px; bottom: 16px; }
  .toast { max-width: 100%; }
}

/* ── Modal Customizado (Premium) ─────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1050;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.ativo {
  opacity: 1;
  pointer-events: all;
}
.modal-card {
  background: var(--cor-card);
  border-radius: 16px;
  width: 90%;
  max-width: 440px;
  box-shadow: 0 12px 36px rgba(0,0,0,0.18);
  transform: translateY(24px);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
}
.modal-overlay.ativo .modal-card {
  transform: translateY(0);
}
.modal-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--cor-borda);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff;
}
.modal-header h3 {
  margin: 0;
  font-size: 1.125rem;
  font-weight: 600;
  color: var(--cor-texto);
}
.modal-body {
  padding: 24px;
}
.modal-footer {
  padding: 14px 24px;
  border-top: 1px solid var(--cor-borda);
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  background: #fafafa;
}
</style>
